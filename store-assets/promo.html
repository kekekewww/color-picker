<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><title>Color Picker promotional artwork</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:'Segoe UI','Microsoft JhengHei',sans-serif;background:#365dcc;color:#fff}
.art{width:440px;height:280px;padding:26px 30px;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between}
.name{font-size:27px;font-weight:650;letter-spacing:-.8px}header img{width:36px;height:36px}
.tagline{font-size:16px;margin:9px 0 25px;color:#fff;letter-spacing:.3px}
.swatches{display:flex;gap:8px}.swatch{width:89px;height:123px;border-radius:10px;display:flex;align-items:flex-end;padding:0 10px 13px;font-family:Consolas,monospace;font-size:12px;font-weight:bold;color:#1e3151}
.swatch:nth-child(1){background:#a9b8ef}.swatch:nth-child(2){background:#f2c94c}.swatch:nth-child(3){background:#ff8496}.swatch:nth-child(4){background:#395f53;color:#fff}
body.marquee .art{width:1400px;height:560px;padding:92px 90px;display:grid;grid-template-columns:1fr 1.1fr;column-gap:90px;align-items:center}
body.marquee .name{font-size:62px;letter-spacing:-2px}body.marquee header img{display:none}body.marquee .tagline{font-size:29px;margin:22px 0 0;letter-spacing:1px}
body.marquee .swatches{gap:14px;align-items:center}body.marquee .swatch{width:130px;height:280px;padding:0 17px 24px;font-size:18px;border-radius:16px}
body.marquee .swatch:nth-child(2){height:330px}body.marquee .swatch:nth-child(3){height:375px}
</style></head>
<body>
<main class="art"><div><header><span class="name">Color Picker</span><img src="../icons/icon48.png" alt=""></header><p class="tagline">選取，即見色彩。</p></div>
<div class="swatches"><div class="swatch">#A9B8EF</div><div class="swatch">#F2C94C</div><div class="swatch">#FF8496</div><div class="swatch">#395F53</div></div></main>
</body></html>
